name: Hotel Booking App Tests

on:
  push:
    branches: [ main, work-branch ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.32.1'

jobs:
  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Run unit tests
        run: flutter test

  android_test:
    name: Android Integration Tests
    runs-on: ubuntu-latest
    needs: unit_tests
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache Android SDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Generate Environment Configuration
        run: flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: Run Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 22
          target: default
          arch: x86
          emulator-options: -no-window -no-audio -no-boot-anim
          disk-size: 1000M
          ram-size: 1024M
          force-avd-creation: true
          script: |
            # Wait for emulator to fully boot
            adb wait-for-device
            adb shell 'while [[ "$(getprop sys.boot_completed)" != "1" ]]; do sleep 2; done'
            echo "✓ Emulator is fully booted and ready"
            
            # Run integration test with reasonable timeout
            flutter test integration_test/app_test.dart --timeout=2m
      
      - name: Upload Android test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: build/reports/

  ios_test:
    name: iOS Integration Tests
    runs-on: macos-latest
    needs: unit_tests
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Generate Environment Configuration
        run: flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: Start iOS Simulator
        run: |
          # Get available simulator
          DEVICE_ID=$(xcrun simctl list devices available | grep iPhone | head -1 | grep -o '[A-F0-9-]\{36\}')
          xcrun simctl boot "$DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
      
      - name: Run iOS integration tests
        run: |
          # Create screenshots directory
          mkdir -p screenshots
          
          # Run the test with error handling
          set +e
          flutter test integration_test/app_test.dart -d "$DEVICE_ID"
          test_exit_code=$?
          
          # Capture screenshot if test fails
          if [ $test_exit_code -ne 0 ]; then
            echo "Test failed, capturing screenshot..."
            xcrun simctl io "$DEVICE_ID" screenshot screenshots/ios_failure.png
          fi
          
          exit $test_exit_code
          
      - name: Upload iOS test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: screenshots/

  test_summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit_tests, android_test, ios_test]
    if: always()
    
    steps:
      - name: Generate test summary
        run: |
          echo "# Test Results Summary" > summary.md
          echo "" >> summary.md
          echo "- Unit Tests: ${{ needs.unit_tests.result }}" >> summary.md
          echo "- Android Tests: ${{ needs.android_test.result }}" >> summary.md
          echo "- iOS Tests: ${{ needs.ios_test.result }}" >> summary.md
      
      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: summary.md
