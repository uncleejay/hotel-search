name: Hotel Booking App Tests

on:
  push:
    branches: [ main, work-branch ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.32.1'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Run unit tests
        run: flutter test --coverage
      
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  android_test:
    name: Android Integration Tests
    runs-on: ubuntu-latest
    needs: test
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Generate Environment Configuration
        run: flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: Run Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          ram-size: 3072M
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -accel on
          disable-animations: true
          script: |
            # Wait for emulator to be fully booted with a more robust check
            echo "Waiting for emulator to be ready..."
            adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 3; done'
            sleep 10  # Additional delay to ensure system is fully stabilized
            
            # Show device info
            adb devices -l
            
            # Disable animations for better test stability
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0
            
            # Set device to stay awake
            adb shell settings put global stay_on_while_plugged_in 3
            
            # Grant permissions that might be needed
            adb shell pm grant $(flutter devices -v | grep emulator | awk '{print $3}') android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant $(flutter devices -v | grep emulator | awk '{print $3}') android.permission.ACCESS_COARSE_LOCATION
            
            # Create screenshots directory
            mkdir -p screenshots
            
            # Run the integration test with retry mechanism
            max_attempts=3
            attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt of $max_attempts"
              
              if flutter test integration_test/app_test.dart --timeout=5m; then
                echo "Tests passed on attempt $attempt"
                exit 0
              else
                echo "Tests failed on attempt $attempt"
                if [ $attempt -lt $max_attempts ]; then
                  echo "Waiting before retry..."
                  sleep 10
                fi
              fi
              
              attempt=$((attempt+1))
            done
            
            echo "All test attempts failed"
            exit 1
      
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-api33
          path: |
            screenshots/

  ios_test:
    name: iOS Integration Tests
    runs-on: macos-latest
    needs: test
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Generate Environment Configuration
        run: flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: Start iOS Simulator
        run: |
          # Get available simulator
          DEVICE_ID=$(xcrun simctl list devices available | grep iPhone | head -1 | grep -o '[A-F0-9-]\{36\}')
          xcrun simctl boot "$DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
      
      - name: Run iOS integration tests
        run: |
          flutter test integration_test/app_test.dart -d "$DEVICE_ID"
      
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            screenshots/

  report:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, android_test, ios_test]
    if: always()
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-results/
      
      - name: Generate simple report
        run: |
          echo "# Test Results" > test-summary.md
          echo "" >> test-summary.md
          echo "- Unit Tests: ${{ needs.test.result }}" >> test-summary.md
          echo "- Android Tests: ${{ needs.android_test.result }}" >> test-summary.md
          echo "- iOS Tests: ${{ needs.ios_test.result }}" >> test-summary.md
      
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-summary.md

