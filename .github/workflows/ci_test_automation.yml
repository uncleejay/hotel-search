name: Hotel Booking App Tests

on:
  push:
    branches: [ main, work-branch ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.32.1'

jobs:
  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Run unit tests
        run: flutter test

  android_test:
    name: Android Integration Tests
    runs-on: ubuntu-latest
    needs: unit_tests
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache Android SDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Generate Environment Configuration
        run: flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: Run Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-snapshot -no-audio -gpu swiftshader_indirect -no-boot-anim -memory 4096 -accel on -no-snapshot-save -avd test -port 5554
          disk-size: 4096M
          ram-size: 4096M
          profile: pixel_6
          force-avd-creation: true
          working-directory: .
          cores: 2
          script: |
            # Set environment variables for emulator
            export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
            export ANDROID_AVD_HOME=$HOME/.android/avd
            
            # Create directories for logs and screenshots with more specific folders
            mkdir -p android_test_artifacts/logs/device
            mkdir -p android_test_artifacts/logs/test_output
            mkdir -p android_test_artifacts/screenshots

            # Verify ADB and emulator paths
            echo "ADB location: $(which adb)"
            echo "Emulator location: $(which emulator)"
            
            # Clean up any stale emulator processes
            pkill -9 emulator64-x86 || true
            pkill -9 qemu-system-x86_64 || true
            
            echo "::group::ADB Connection Verification"
            echo "Verifying ADB connection..."
            # Ensure ADB server is in a clean state
            adb kill-server || true
            sleep 2
            adb start-server
            adb devices  # Initial check
            sleep 5

            # Force-stop and restart ADB server if no devices are found
            if ! adb devices | grep -q "emulator"; then
                echo "No emulator found, restarting ADB server..."
                adb kill-server
                sleep 2
                adb start-server
                sleep 5
            fi

            echo "Initial ADB devices:"
            adb devices
            echo "Waiting for device to be fully connected..."
            adb wait-for-device
            # More robust boot completion check
            timeout 300 bash -c 'until adb shell getprop sys.boot_completed 2>&1 | grep -m 1 "1"; do sleep 2; done'
            echo "Device boot completed"
            adb devices -l
            echo "Device properties:"
            adb shell getprop ro.serialno
            adb shell getprop ro.product.model
            echo "::endgroup::"
            
            echo "::group::Emulator Boot Process"
            # Wait for emulator to fully boot with progressive feedback
            echo "Waiting for emulator to start..."
            adb wait-for-device
            echo "Device connected, waiting for boot completion..."
            # Verify device is visible after wait-for-device
            echo "Current connected devices:"
            adb devices
            
            # Get initial device diagnostics
            adb devices -l > android_test_artifacts/logs/device/devices_initial.log
            
            # Wait with timeout and progress indication
            boot_timeout=180
            start_time=$(date +%s)
            boot_completed=false
            
            while true; do
              # Check if the device is fully booted
              if adb shell getprop sys.boot_completed | grep -q '1'; then
                echo "✓ Emulator is fully booted and ready"
                boot_completed=true
                break
              fi
              
              current_time=$(date +%s)
              elapsed=$((current_time - start_time))
              
              # Only collect properties every 30 seconds to reduce noise
              if [ $((elapsed % 30)) -eq 0 ]; then
                echo "Collecting device properties at ${elapsed}s mark..."
                adb shell getprop > android_test_artifacts/logs/device/props_${elapsed}s.log
              fi
              
              if [ $elapsed -gt $boot_timeout ]; then
                echo "⚠️ Emulator boot timeout after ${boot_timeout}s. Capturing diagnostics before continuing..."
                adb logcat -d > android_test_artifacts/logs/device/boot_timeout_logcat.log
                adb shell screencap -p /sdcard/boot_timeout_screen.png
                adb pull /sdcard/boot_timeout_screen.png android_test_artifacts/screenshots/
                break
              fi
              
              echo "Waiting for emulator boot completion: ${elapsed}s elapsed..."
              sleep 5
            done
            echo "::endgroup::"
            
            echo "::group::Device Configuration"
            # Collect comprehensive device info for debugging
            echo "Collecting device diagnostics..."
            adb devices -l > android_test_artifacts/logs/device/devices_final.log
            adb shell getprop > android_test_artifacts/logs/device/props_final.log
            adb shell settings list system > android_test_artifacts/logs/device/settings_system.log
            adb shell pm list packages -f > android_test_artifacts/logs/device/packages.log
            
            # Disable animations to improve test stability
            echo "Disabling animations for test stability..."
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0
            echo "::endgroup::"
            
            # Start detailed logcat capture in background with filters for Flutter and app
            echo "Starting logcat capture..."
            adb logcat *:I > android_test_artifacts/logs/device/full_logcat.log &
            FULL_LOGCAT_PID=$!
            
            # Separate Flutter-specific logs for easier debugging
            adb logcat -v time ActivityManager:I flutter:V *:S > android_test_artifacts/logs/test_output/flutter_logcat.log &
            FLUTTER_LOGCAT_PID=$!
            
            echo "::group::Integration Test Execution"
            # Create a dedicated test output file
            touch android_test_artifacts/logs/test_output/flutter_test_output.log
            
            # Run integration test with explicit timeout and verbose output
            echo "Starting integration tests with verbose output..."
            set +e
            flutter --verbose test \
              --timeout=5m \
              --machine \
              --dart-define=CI=true \
              integration_test/app_test.dart \
              2>&1 | tee android_test_artifacts/logs/test_output/flutter_test_output.log
            TEST_EXIT_CODE=$?
            set -e
            echo "::endgroup::"
            
            # Stop logcat captures
            echo "Stopping logcat capture..."
            kill $FULL_LOGCAT_PID || true
            kill $FLUTTER_LOGCAT_PID || true
            
            echo "::group::Test Results & Diagnostics"
            # Capture screenshot regardless of test result for diagnostics
            echo "Capturing final device screenshot..."
            adb shell screencap -p /sdcard/final_screen.png
            adb pull /sdcard/final_screen.png android_test_artifacts/screenshots/final_state.png
            
            # If test failed, capture additional diagnostics and screenshots
            if [ $TEST_EXIT_CODE -ne 0 ]; then
              echo "❌ Tests failed with exit code $TEST_EXIT_CODE"
              
              # Capture additional screenshots from different app screens if possible
              echo "Attempting to capture additional diagnostic screenshots..."
              for i in {1..3}; do
                adb shell input swipe 500 1000 500 300  # Scroll down
                sleep 1
                adb shell screencap -p /sdcard/failure_screen_${i}.png
                adb pull /sdcard/failure_screen_${i}.png android_test_artifacts/screenshots/
              done
              
              # Capture comprehensive device state information
              echo "Capturing device state diagnostics..."
              adb shell dumpsys meminfo > android_test_artifacts/logs/device/meminfo.log
              adb shell dumpsys activity > android_test_artifacts/logs/device/activity.log
              adb shell dumpsys window > android_test_artifacts/logs/device/window.log
              adb shell ps > android_test_artifacts/logs/device/process_list.log
              
              # Create a detailed summary file
              echo "Tests failed with exit code $TEST_EXIT_CODE" > android_test_artifacts/summary.txt
              if [ "$boot_completed" = false ]; then
                echo "Boot process did not complete properly" >> android_test_artifacts/summary.txt
              fi
              
              # Extract key error messages from the test output
              echo "Extracting key error messages..."
              grep -E "Error:|Exception:|Failed|failure|FAIL" android_test_artifacts/logs/test_output/flutter_test_output.log > android_test_artifacts/logs/test_output/error_summary.log || true
            else
              echo "✅ Tests completed successfully!"
              echo "Tests completed successfully" > android_test_artifacts/summary.txt
            fi
            echo "::endgroup::"
            
            exit $TEST_EXIT_CODE
      
      - name: Upload Android test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            android_test_artifacts/
            build/reports/

  ios_test:
    name: iOS Integration Tests
    runs-on: macos-latest
    needs: unit_tests
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Generate Environment Configuration
        run: flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: Start iOS Simulator
        run: |
          # Get available simulator
          DEVICE_ID=$(xcrun simctl list devices available | grep iPhone | head -1 | grep -o '[A-F0-9-]\{36\}')
          xcrun simctl boot "$DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
      
      - name: Run iOS integration tests
        run: |
          # Create screenshots directory
          mkdir -p screenshots
          
          # Run the test with error handling
          set +e
          flutter test integration_test/app_test.dart -d "$DEVICE_ID"
          test_exit_code=$?
          
          # Capture screenshot if test fails
          if [ $test_exit_code -ne 0 ]; then
            echo "Test failed, capturing screenshot..."
            xcrun simctl io "$DEVICE_ID" screenshot screenshots/ios_failure.png
          fi
          
          exit $test_exit_code
          
      - name: Upload iOS test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: screenshots/

  test_summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit_tests, android_test, ios_test]
    if: always()
    
    steps:
      - name: Generate test summary
        run: |
          echo "# Test Results Summary" > summary.md
          echo "" >> summary.md
          echo "- Unit Tests: ${{ needs.unit_tests.result }}" >> summary.md
          echo "- Android Tests: ${{ needs.android_test.result }}" >> summary.md
          echo "- iOS Tests: ${{ needs.ios_test.result }}" >> summary.md
      
      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: summary.md
